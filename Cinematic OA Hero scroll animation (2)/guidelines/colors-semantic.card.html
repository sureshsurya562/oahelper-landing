<!-- @dsCard group="Colors" viewport="700x130" subtitle="Accent, success and difficulty" name="Semantic" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;}body{padding:20px;box-sizing:border-box;min-height:100vh;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);-webkit-font-smoothing:antialiased;}</style></head>
<body><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
<span style="padding:9px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:1.5px solid #151515;box-shadow:var(--shadow-hard);font:600 13px/1 var(--font-sans)">--accent</span>
<span style="font:400 13px/1 var(--font-mono);color:var(--success)">✓ --success</span>
<span style="padding:5px 9px;border-radius:999px;background:var(--diff-easy-bg);color:var(--diff-easy-fg);font:400 12px/1 var(--font-sans)">Easy</span>
<span style="padding:5px 9px;border-radius:999px;background:var(--diff-medium-bg);color:var(--diff-medium-fg);font:400 12px/1 var(--font-sans)">Medium</span>
<span style="padding:5px 9px;border-radius:999px;background:var(--diff-hard-bg);color:var(--diff-hard-fg);font:400 12px/1 var(--font-sans)">Hard</span>
<span style="padding:5px 9px;border-radius:999px;background:var(--surface-chip-dark);color:var(--text-muted);font:400 12px/1 var(--font-sans)">Topic chip</span></div></body></html>
