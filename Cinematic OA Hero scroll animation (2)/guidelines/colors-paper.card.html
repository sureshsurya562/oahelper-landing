<!-- @dsCard group="Colors" viewport="700x150" subtitle="Warm light sections, cards and ink" name="Paper" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;}body{padding:20px;box-sizing:border-box;min-height:100vh;font-family:var(--font-sans);background:var(--surface-paper);color:var(--text-on-paper);-webkit-font-smoothing:antialiased;}.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}.s{display:flex;flex-direction:column;gap:5px}.c{height:56px;border-radius:12px;border:1px solid rgba(21,21,21,0.14)}.s b{font:500 10.5px/1.2 var(--font-mono);color:var(--paper-ink)}.s span{font:400 10.5px/1 var(--font-mono);color:var(--paper-fg-3)}</style></head>
<body><div class="row"><div class="s"><div class="c" style="background:var(--paper-100);"></div><b>--paper-100</b><span>section</span></div><div class="s"><div class="c" style="background:var(--paper-50);"></div><b>--paper-50</b><span>card</span></div><div class="s"><div class="c" style="background:var(--paper-150);"></div><b>--paper-150</b><span>chip</span></div><div class="s"><div class="c" style="background:var(--paper-rim);"></div><b>--paper-rim</b><span>sticker rim</span></div><div class="s"><div class="c" style="background:var(--paper-ink);"></div><b>--paper-ink</b><span>ink</span></div><div class="s"><div class="c" style="background:var(--paper-fg-2);"></div><b>--paper-fg-2</b><span>muted</span></div><div class="s"><div class="c" style="background:var(--paper-fg-3);"></div><b>--paper-fg-3</b><span>subtle</span></div></div></body></html>
