<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;}body{padding:20px;box-sizing:border-box;min-height:100vh;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);-webkit-font-smoothing:antialiased;}</style></head>
<body><div style="display:flex;gap:14px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:62px;border-radius:var(--radius-xs);background:var(--surface-raised);border:1px solid var(--border-dark-strong)"></div><span style="font:400 10px/1 var(--font-mono);color:var(--text-subtle)">xs · 6</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:62px;border-radius:var(--radius-sm);background:var(--surface-raised);border:1px solid var(--border-dark-strong)"></div><span style="font:400 10px/1 var(--font-mono);color:var(--text-subtle)">sm · 8</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:62px;border-radius:var(--radius-md);background:var(--surface-raised);border:1px solid var(--border-dark-strong)"></div><span style="font:400 10px/1 var(--font-mono);color:var(--text-subtle)">md · 12</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:62px;border-radius:var(--radius-lg);background:var(--surface-raised);border:1px solid var(--border-dark-strong)"></div><span style="font:400 10px/1 var(--font-mono);color:var(--text-subtle)">lg · 14</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:62px;border-radius:var(--radius-xl);background:var(--surface-raised);border:1px solid var(--border-dark-strong)"></div><span style="font:400 10px/1 var(--font-mono);color:var(--text-subtle)">xl · 16</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:62px;border-radius:var(--radius-2xl);background:var(--surface-raised);border:1px solid var(--border-dark-strong)"></div><span style="font:400 10px/1 var(--font-mono);color:var(--text-subtle)">2xl · 22</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:62px;border-radius:var(--radius-3xl);background:var(--surface-raised);border:1px solid var(--border-dark-strong)"></div><span style="font:400 10px/1 var(--font-mono);color:var(--text-subtle)">3xl · 24</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:62px;height:62px;border-radius:var(--radius-pill);background:var(--surface-raised);border:1px solid var(--border-dark-strong)"></div><span style="font:400 10px/1 var(--font-mono);color:var(--text-subtle)">pill · 999</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:40px;border-radius:var(--radius-sticker);background:var(--peach);border:1.5px solid var(--paper-rim)"></div><span style="font:400 10px/1 var(--font-mono);color:var(--text-subtle)">sticker</span></div></div></body></html>
