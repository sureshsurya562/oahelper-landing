<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;}body{padding:20px;box-sizing:border-box;min-height:100vh;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);-webkit-font-smoothing:antialiased;}</style></head>
<body><div style="display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:16px;background:var(--surface-panel)"><div style="display:flex;justify-content:space-between;gap:12px;font:400 14px/1 var(--font-sans);color:var(--fg-1)"><span>Headlines, key values</span><span style="font-family:var(--font-mono);font-size:11px">--fg-1</span></div><div style="display:flex;justify-content:space-between;gap:12px;font:400 14px/1 var(--font-sans);color:var(--fg-2)"><span>Body on terminal, emphasis</span><span style="font-family:var(--font-mono);font-size:11px">--fg-2</span></div><div style="display:flex;justify-content:space-between;gap:12px;font:400 14px/1 var(--font-sans);color:var(--fg-3)"><span>Paragraphs, secondary copy</span><span style="font-family:var(--font-mono);font-size:11px">--fg-3</span></div><div style="display:flex;justify-content:space-between;gap:12px;font:400 14px/1 var(--font-sans);color:var(--fg-4)"><span>Meta, captions</span><span style="font-family:var(--font-mono);font-size:11px">--fg-4</span></div><div style="display:flex;justify-content:space-between;gap:12px;font:400 14px/1 var(--font-sans);color:var(--fg-5)"><span>Line numbers, disabled</span><span style="font-family:var(--font-mono);font-size:11px">--fg-5</span></div></div></body></html>
