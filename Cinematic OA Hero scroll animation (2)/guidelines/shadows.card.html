<!-- @dsCard group="Effects" viewport="700x170" subtitle="Hard offset, sticker, float and hover" name="Shadows" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;}body{padding:20px;box-sizing:border-box;min-height:100vh;font-family:var(--font-sans);background:var(--surface-paper);color:var(--text-on-paper);-webkit-font-smoothing:antialiased;}</style></head>
<body><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><span style="padding:10px 16px;border-radius:999px;background:var(--mint);border:1.5px solid #151515;box-shadow:var(--shadow-hard);font:600 13px/1 var(--font-sans);color:var(--mint-ink)">hard</span><span style="font:400 10px var(--font-mono);color:var(--paper-fg-3)">--shadow-hard</span></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><span style="padding:8px 15px;border-radius:var(--radius-sticker);background:var(--sky);border:1.5px solid var(--paper-rim);box-shadow:var(--shadow-sticker);font:500 13px/1 var(--font-sans);color:var(--sky-ink)">sticker</span><span style="font:400 10px var(--font-mono);color:var(--paper-fg-3)">--shadow-sticker</span></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:120px;height:60px;border-radius:16px;background:var(--paper-50);border:1px dashed var(--border-dashed-paper);box-shadow:var(--shadow-card-hover);transform:translateY(-4px)"></div><span style="font:400 10px var(--font-mono);color:var(--paper-fg-3)">--shadow-card-hover</span></div>
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:120px;height:60px;border-radius:16px;background:var(--ink-900);box-shadow:var(--shadow-float)"></div><span style="font:400 10px var(--font-mono);color:var(--paper-fg-3)">--shadow-float</span></div></div></body></html>
