<!-- @dsCard group="Colors" viewport="700x150" subtitle="Dark surfaces from page to strong line" name="Ink neutrals" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;}body{padding:20px;box-sizing:border-box;min-height:100vh;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);-webkit-font-smoothing:antialiased;}.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}.s{display:flex;flex-direction:column;gap:5px}.c{height:56px;border-radius:12px;border:1px solid var(--border-hairline)}.s b{font:500 10.5px/1.2 var(--font-mono);color:var(--text-secondary)}.s span{font:400 10.5px/1 var(--font-mono);color:var(--text-subtle)}</style></head>
<body><div class="row"><div class="s"><div class="c" style="background:var(--ink-1000);"></div><b>--ink-1000</b><span>#0b0b0b</span></div><div class="s"><div class="c" style="background:var(--ink-950);"></div><b>--ink-950</b><span>#0f0f10</span></div><div class="s"><div class="c" style="background:var(--ink-900);"></div><b>--ink-900</b><span>#151515</span></div><div class="s"><div class="c" style="background:var(--ink-850);"></div><b>--ink-850</b><span>#1c1c1e</span></div><div class="s"><div class="c" style="background:var(--ink-800);"></div><b>--ink-800</b><span>#202022</span></div><div class="s"><div class="c" style="background:var(--ink-750);"></div><b>--ink-750</b><span>#26262a</span></div><div class="s"><div class="c" style="background:var(--ink-700);"></div><b>--ink-700</b><span>#2a2a2c</span></div><div class="s"><div class="c" style="background:var(--ink-650);"></div><b>--ink-650</b><span>#2e2e32</span></div><div class="s"><div class="c" style="background:var(--ink-600);"></div><b>--ink-600</b><span>#3a3a3e</span></div></div></body></html>
