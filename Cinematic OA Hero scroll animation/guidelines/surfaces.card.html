<!-- @dsCard group="Effects" viewport="700x190" subtitle="Dotted ink panel, dashed paper card, glass" name="Surfaces and patterns" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;}body{padding:20px;box-sizing:border-box;min-height:100vh;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);-webkit-font-smoothing:antialiased;}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;height:150px">
<div style="border-radius:22px;border:1px solid var(--border-hairline);background-color:var(--surface-panel);background-image:var(--pattern-dots);background-size:var(--pattern-dots-size);display:flex;align-items:flex-end;padding:12px;font:400 10.5px var(--font-mono);color:var(--text-subtle)">panel + dots 22px</div>
<div style="border-radius:22px;border:1px dashed var(--border-dashed-paper);background:var(--surface-paper-card);display:flex;align-items:flex-end;padding:12px;font:400 10.5px var(--font-mono);color:var(--paper-fg-3)">paper card, dashed</div>
<div style="position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,var(--lilac),var(--sky));display:flex;align-items:flex-start;padding:12px"><span style="padding:9px 12px;border-radius:12px;background:rgba(15,15,16,0.72);backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);font:600 16px/1 var(--font-mono);color:var(--fg-1)">08 : 38 : 53</span></div></div></body></html>
