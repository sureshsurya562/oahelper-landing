<!-- @dsCard group="Components" viewport="700x300" name="Core" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_loader.js"></script>
<style>html,body{margin:0;}body{padding:20px;box-sizing:border-box;min-height:100vh;background:var(--surface-page);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}</style></head>
<body><div id="root"></div>
<script type="text/babel" data-presets="react">
(async () => {
  const { Button, Tag, Eyebrow, Callout, Sticker, Wordmark, Logo } = await loadOADS(['./Button.jsx', './Tag.jsx', './Eyebrow.jsx', './Callout.jsx', './Sticker.jsx', './Wordmark.jsx', './Logo.jsx']);
  const row = { display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 12 };
  ReactDOM.createRoot(document.getElementById('root')).render(
    <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
      <div style={row}><Button arrow>Get OA-ready</Button><Button variant="accent">Start practising</Button><Button variant="ghost" size="sm">Run</Button><Button size="sm" arrow="circle">Solve Now</Button><Button disabled size="sm">Disabled</Button></div>
      <div style={row}><Tag variant="difficulty" level="easy" /><Tag variant="difficulty" level="medium" /><Tag variant="difficulty" level="hard" /><Tag>Prefix Sum</Tag><Tag variant="difficulty" level="medium" dot /><Eyebrow>By the numbers</Eyebrow><Logo height={22} /><Logo variant="lockup" height={24} /></div>
      <div style={row}><Sticker color="mint" rotate={-5}>Google</Sticker><Sticker color="sky" rotate={4}>Microsoft</Sticker><Sticker color="peach" rotate={-7} size="lg">Amazon</Sticker><Sticker color="lilac" rotate={6}>Meta</Sticker><Sticker color="coral" rotate={-3} size="sm">Adobe</Sticker></div>
      <div style={{ ...row, padding: 16, borderRadius: 16, background: 'var(--surface-paper)' }}><Callout size="lg">See, Solve and Clear</Callout><Callout color="peach">Real OA Questions</Callout><Eyebrow tone="paper">OA Helper vs others</Eyebrow><Button variant="ink" size="sm" arrow>Browse</Button></div>
    </div>
  );
})();
</script></body></html>
